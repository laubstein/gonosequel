name: Release

# Cuts a GitHub Release with cross-platform binaries whenever a version
# tag (v1.2.3-style) is pushed. Each binary is self-contained — the
# frontend (web/dist) and the docs site (docs/.vitepress/dist, at /doc)
# are built once and embedded via go:embed, same as `make build` does
# locally — so there is nothing else to download or install alongside it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build docs (embedded at /doc)
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          name="gonosequel-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then name="$name.exe"; fi
          go build -trimpath -ldflags "-s -w -X github.com/laubstein/gonosequel/pkg/api.Version=${GITHUB_REF_NAME}" -o "dist/$name" .

      - uses: actions/upload-artifact@v4
        with:
          name: gonosequel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
